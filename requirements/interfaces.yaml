# Interface Specifications
# Safety-Supervised Edge AI Demonstrator

---
# ROS2 Topics (Linux Domain)

topics:
  /detections:
    type: vision_msgs/Detection2DArray
    qos:
      reliability: BEST_EFFORT
      history: KEEP_LAST
      depth: 10
    publisher: camera_ai_node
    subscribers:
      - decision_node
    rate: 10 Hz
    description: Object detection results from AI inference
    safety_relevant: false

  /obstacles:
    type: sensor_msgs/Range
    qos:
      reliability: RELIABLE
      history: KEEP_LAST
      depth: 5
    publisher: ultrasonic_node
    subscribers:
      - decision_node
    rate: 20 Hz
    description: Ultrasonic distance measurements
    safety_relevant: true
    notes: >
      Rate increased from 10 Hz to 20 Hz (50ms period) to support SYS-SAFE-011
      proximity FTTI of 100ms. Combined with decision_node at 50 Hz, worst-case
      FTTI = 50ms + 20ms + 10ms overhead = 80ms < 100ms.

  /cmd_vel:
    type: geometry_msgs/Twist
    qos:
      reliability: RELIABLE
      history: KEEP_LAST
      depth: 1
    publisher: decision_node
    subscribers:
      - actuator_node
    rate: 50 Hz
    description: Velocity commands for motion control
    safety_relevant: false

  /system_health:
    type: diagnostic_msgs/DiagnosticArray
    qos:
      reliability: RELIABLE
      history: KEEP_LAST
      depth: 5
    publisher: health_node
    subscribers:
      - decision_node
    rate: 1 Hz
    description: Node health status and diagnostics
    safety_relevant: true

---
# I2C Interface (Q&A Watchdog — Primary Safety Channel)

i2c:
  qa_watchdog:
    description: Challenge/response watchdog between Pi5 (I2C master) and Pi400 (I2C slave)
    direction: Bidirectional (Pi5 reads seed, Pi5 writes response)
    pi5_role: I2C master
    pi400_role: UDP server port 9001 (I2C BSC slave not feasible on BCM2711 — DD-002)
    pi5_gpio_sda: 2  # Pin 3
    pi5_gpio_scl: 3  # Pin 5
    pi400_gpio_sda: 2  # Pin 3
    pi400_gpio_scl: 3  # Pin 5
    pull_ups: 4.7 kΩ to 3.3V on SDA and SCL (provided on Pi5/breadboard side)
    bus_speed: 100 kHz
    safety_critical: true

    registers:
      seed:
        address: 0x00
        width: 4 bytes (uint32_t)
        written_by: Pi400 (generates new random seed each cycle)
        read_by: Pi5
        description: Current watchdog seed value

      response:
        address: 0x01
        width: 4 bytes (uint32_t)
        written_by: Pi5
        read_by: Pi400 (validates value and timing)
        description: Pi5-computed response to current seed

    algorithm:
      response_computation: response = seed XOR 0xA5A5A5A5
      description: Pi5 XORs the received seed with the fixed mask to compute the response

    timing:
      window_total_ms: 30   # total window length
      window_open_ms: 15    # closed window end — response before this → too early
      window_close_ms: 30   # window timeout — response after this → missed
      target_send_ms: 20    # Pi5 health_node 20ms cycle → responds at ~20ms ∈ [15,30] ✓
      health_node_cycle_ms: 20

    failure_counter:
      increment_conditions:
        - Response value incorrect
        - Response arrives before open window (<50 ms)
        - Response does not arrive before window close (>100 ms, timeout)
      decrement_condition: 2 consecutive correct in-window responses → decrement by 1
      safe_state_threshold: 3
      safe_state_action: Pi400 asserts GPIO 25 LOW (e-stop) and GPIO 22 HIGH (red LED)

---
# GPIO Interfaces (Inter-Processor)

gpio:
  emergency_stop:
    direction: QNX → Linux
    qnx_gpio_output: 25  # Pi400 Pin 22
    linux_gpio: 25       # Pi5 Pin 22
    physical_pin_pi400: 22
    physical_pin_pi5: 22
    signal_type: Digital output (QNX), polled input (Linux)
    voltage: 3.3V logic level
    active_state: Active-low (0V = emergency stop)
    default_state: LOW (asserted at Pi400 boot — fail-safe)
    poll_rate: 100 Hz (Linux actuator node)
    response_time: <30 ms (from assertion to motor disable)
    description: Emergency stop command from QNX supervisor to actuator node
    safety_critical: true

  red_led:
    description: SAFE STATE red LED, driven by wired-OR from Pi5 GPIO 22 and Pi400 GPIO 22 via 1N4148 diodes
    pi5_gpio: 22
    pi400_gpio: 22
    circuit: Diode-OR (1N4148 + 150 Ω per leg)
    active_state: HIGH = LED ON
    driven_by_pi5: actuator_node on SAFE_STATE entry
    driven_by_pi400: safe_state_ctrl on failure_counter >= 3
    safety_critical: false (indicator only)

  green_led:
    description: NORMAL state indicator
    pi5_gpio: 17
    physical_pin: 11
    driven_by: health_node
    active_state: HIGH = LED ON

  yellow_led:
    description: DEGRADED state indicator (one of two sensor paths degraded)
    pi5_gpio: 27
    physical_pin: 13
    driven_by: health_node
    active_state: HIGH = LED ON

  ultrasonic_sig:
    sensor: Grove Ultrasonic Ranger (×1, front-facing)
    linux_gpio: 23
    physical_pin: 16
    protocol: Single-wire SIG (bidirectional — output for trigger, input for echo)
    voltage: 3.3V (sensor powered at 3.3V; no voltage divider required)
    trigger_pulse: 10 µs HIGH
    range_cm: 2–350
    safety_critical: false

---
# Ethernet Interface (Inter-Processor Supervisor Link)

ethernet:
  supervisor_link:
    description: Dedicated direct Ethernet link between Pi 5 and Pi 400 for future supervisor/watchdog communication
    pi5_address: 192.168.50.10/24
    pi400_address: 192.168.50.20/24
    interface_name: eth0 (confirm actual name with `ip link show` on each board)
    purpose_m1: Connectivity verification — ping only. No protocol implemented in M1.
    purpose_future: Heartbeat/watchdog communication (protocol details deferred to later milestone)
    m1_verification: ping -c 4 from each board to the other; 0% packet loss expected
    safety_critical: false (M1 only; may become safety-relevant in later milestones)
    notes:
      - Development SSH access uses a separate network (Wi-Fi or home LAN)
      - Heartbeat GPIO remains the primary safety-critical inter-processor signal
      - This Ethernet link is supplementary and not part of the M1 safety concept

---
# Shared Memory Interface (Inter-Processor)

shared_memory:
  name: /dev/shm/safety_state
  size: 4096  # 4KB page-aligned
  access:
    linux: Read/Write
    qnx: Read-only
  update_rate: 10 Hz (written by Linux)
  validation: CRC32 checksum

  structure:
    - field: magic
      type: uint32_t
      offset: 0
      value: 0xCAFEBABE
      description: Magic number for structure validation

    - field: version
      type: uint8_t
      offset: 4
      value: 1
      description: Protocol version number

    - field: linux_state
      type: uint8_t
      offset: 5
      values:
        0: LINUX_STATE_INIT
        1: LINUX_STATE_NORMAL
        2: LINUX_STATE_WARNING
        3: LINUX_STATE_DEGRADED
        4: LINUX_STATE_ERROR
      description: Current state of Linux domain

    - field: node_status
      type: uint8_t
      offset: 6
      bitmask:
        bit0: camera_ai_node_alive
        bit1: ultrasonic_node_alive
        bit2: decision_node_alive
        bit3: actuator_node_alive
        bit4: health_node_alive
        bit5-7: reserved
      description: Liveness bitmap for ROS2 nodes

    - field: heartbeat_count
      type: uint32_t
      offset: 8
      description: Monotonic counter incremented with each heartbeat
      overflow: Wraps at UINT32_MAX

    - field: timestamp_ms
      type: uint64_t
      offset: 12
      description: Linux system timestamp (milliseconds since boot)
      source: CLOCK_MONOTONIC

    - field: sensor_health
      type: uint8_t
      offset: 20
      values:
        0: SENSORS_OK
        1: CAMERA_DEGRADED
        2: ULTRASONIC_DEGRADED
        3: MULTIPLE_DEGRADED
      description: Aggregate sensor health status

    - field: reserved
      type: uint8_t[11]
      offset: 21
      description: Reserved for future use, must be zero

    - field: crc32
      type: uint32_t
      offset: 32
      description: CRC32 checksum over bytes 0-31
      polynomial: 0xEDB88320 (IEEE CRC32)

  total_size: 36 bytes (rest of 4KB unused)

---
# Message Definitions (Custom)

custom_messages:
  SafetyState:
    package: safety_msgs
    fields:
      - name: supervisor_state
        type: uint8
        values:
          0: SUPERVISOR_INIT
          1: SUPERVISOR_OK
          2: SUPERVISOR_WARNING
          3: SUPERVISOR_SAFE_STATE
      - name: last_heartbeat_ms
        type: uint64
        description: Time of last valid heartbeat (QNX local clock)
      - name: fault_code
        type: uint32
        description: Bitfield of detected faults
        bitmask:
          bit0: WATCHDOG_TIMEOUT
          bit1: CRC_ERROR
          bit2: INVALID_STATE
          bit3: GPIO_FAULT
      - name: uptime_ms
        type: uint64
        description: Supervisor uptime since last reset

---
# Timing Constraints

timing:
  qa_watchdog_window:
    open_ms: 50
    close_ms: 100
    target_response_ms: 70
    source: Pi5 health_node (I2C master)
    description: Pi5 must send correct response between 50–100 ms after last acknowledged response

  watchdog_monitoring:
    cycle_time: 10 ms
    window_timeout_ms: 100
    failure_counter_threshold: 3
    detection_latency: <100 ms
    source: Pi400 QNX Watchdog Server

  watchdog_ftti:
    requirement: SYS-SAFE-006
    window_ms: 30
    fail_threshold: 3
    detection_ms: 90       # 3 × 30ms
    gpio_overhead_ms: 20
    poll_overhead_ms: 10
    motor_disable_ms: 30
    total_worst_case_ms: 150
    note: 30ms window × 3 failures + GPIO + poll + motor = 150ms (within SYS-SAFE-006)

  proximity_ftti:
    requirement: SYS-SAFE-011
    ftti_budget_ms: 100
    ultrasonic_period_ms: 50   # 20 Hz
    decision_period_ms: 20     # 50 Hz
    overhead_ms: 10
    worst_case_ms: 80
    margin_ms: 20
    description: >
      Worst-case latency from ultrasonic reading below SAFE_DISTANCE (0.15m)
      to SAFE_STATE entry. camera_valid=true (from camera AI) is a precondition
      but the timed trigger is the ultrasonic measurement only.

  safe_state_latency:
    detection_to_decision: <20 ms
    decision_to_actuation: <30 ms
    total_budget: <150 ms
    source: QNX Safe State Controller

  ros2_message_latency:
    perception_to_decision: <50 ms
    decision_to_actuation: <30 ms
    end_to_end: <200 ms (NORMAL state)

---
# Protocol Compliance

protocols:
  ros2:
    version: ROS2 Humble
    middleware: FastDDS (default)
    domain_id: 0
    security: false (not required for demo)

  gpio:
    standard: Linux GPIO sysfs / libgpiod
    electrical: 3.3V CMOS logic, GPIO_DRIVE_STRENGTH_2MA

  shared_memory:
    standard: POSIX shm_open / mmap
    synchronization: Lock-free read (QNX), mutex write (Linux)
    endianness: Little-endian (ARM architecture)

---
# Safety Notes

safety_considerations:
  - GPIO heartbeat is single point of failure (no redundant wiring)
  - Shared memory corruption detected by CRC but not authenticated
  - ROS2 topics in development domain are not safety-certified
  - Emergency stop GPIO provides fail-safe path independent of ROS2
  - All safety-critical interfaces (GPIO heartbeat, emergency stop) use simple protocols
